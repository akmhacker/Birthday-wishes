<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sonam 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Optional soft music - browsers often block autoplay until user clicks -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c1b0e1b0e.mp3" type="audio/mpeg">
    </audio>

    <div class="cursor"></div>
    <div class="floating-container" id="floatingContainer"></div>

    <div class="container">
        <h1 class="title">Happy Birthday <span>Sonam</span> 💖🌷</h1>
        <div class="greeting" id="greeting"></div>
        <button class="cta-button" id="enterBtn">
            Click to Enter Our World 💕
        </button>
        <p class="hint">Turn sound on… and keep clicking ✨</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
